[project]
name = "rv-backup-helper"
version = "0.1.0"
description = "RV backup camera video capture, grid calibration and OSD overlay tooling"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.6,<7",
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<5",
    # Friendly capture-device names. DirectShow enumerates every video device,
    # including ones it cannot open itself, so a grabber with no signal still
    # gets its real name.
    "pygrabber>=0.2; sys_platform == 'win32'",
    # Talking to the Arduino, to blank the overlay while recording calibration.
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.4,<1",
]

[project.scripts]
rv-backup-helper = "rvBackupHelper.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"
python_files = ["test*.py"]
python_functions = ["test*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rvBackupHelper"]
